<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Drone Flight</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:none}
  canvas{display:block}
  #title{position:fixed;left:48px;top:36px;color:#fff;font:300 34px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:8px;opacity:.85;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  #title small{display:block;font-size:14px;letter-spacing:5px;margin-top:10px;opacity:.75}
  #hud{position:fixed;left:48px;bottom:40px;color:#eaf7ff;font:600 20px/1.6 "DejaVu Sans Mono",monospace;text-shadow:0 0 10px rgba(0,140,255,.8);opacity:.9}
  #hud span{display:inline-block;min-width:90px;opacity:.6;font-weight:400}
  #rec{position:fixed;right:48px;top:40px;color:#fff;font:600 18px monospace;letter-spacing:3px}
  #rec i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#ff3b30;margin-right:10px;animation:b 1s steps(2) infinite}
  @keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<div id="title">DRONE&nbsp;FLIGHT<small>AERIAL SURVEY · LIVE 3D</small></div>
<div id="rec"><i></i>REC</div>
<div id="hud"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const fogColor = new THREE.Color(0xc3d9ea);
scene.fog = new THREE.FogExp2(fogColor, 0.0042);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 2500);

// ---------- Sky ----------
const sunDir = new THREE.Vector3(0.55, 0.62, 0.35).normalize();
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1000, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top:{value:new THREE.Color(0x2c66ad)}, bottom:{value:fogColor}, sunDir:{value:sunDir} },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 bottom; uniform vec3 sunDir; varying vec3 vDir;
      void main(){
        float h = max(vDir.y, 0.0);
        vec3 c = mix(bottom, top, pow(h, 0.55));
        float s = max(dot(normalize(vDir), sunDir), 0.0);
        c += vec3(1.0,0.92,0.75) * (pow(s, 900.0)*6.0 + pow(s, 12.0)*0.25);
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`
  })
);
scene.add(sky);

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xd6ecff, 0x4b5a37, 0.75));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-22, right:22, top:22, bottom:-22, near:1, far:400});
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// ---------- Terrain ----------
function H(x, z){
  const r = Math.hypot(x, z);
  return 7*Math.sin(x*0.018)*Math.cos(z*0.016)
       + 3.5*Math.sin(x*0.047 + z*0.039)
       + 1.3*Math.sin(x*0.13)*Math.sin(z*0.11)
       + 0.4*Math.sin(x*0.41 + z*0.33)
       + Math.pow(Math.max(0, r - 250)/100, 2) * 18 * (0.7 + 0.3*Math.sin(Math.atan2(z,x)*7));
}
const WATER_Y = -4;
{
  const size = 1800, seg = 300;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count*3);
  const sand = new THREE.Color(0xcdbb8a), grass = new THREE.Color(0x5f8a3a), grass2 = new THREE.Color(0x3f6b2a),
        rock = new THREE.Color(0x857d72), snow = new THREE.Color(0xf4f6f8), c = new THREE.Color();
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i), y = H(x, z);
    pos.setY(i, y);
    const n = 0.5 + 0.5*Math.sin(x*0.07)*Math.cos(z*0.09);
    if (y < WATER_Y + 1.2) c.copy(sand);
    else if (y < 14) c.copy(grass).lerp(grass2, n);
    else if (y < 55) c.copy(grass2).lerp(rock, Math.min(1, (y-14)/25));
    else c.copy(rock).lerp(snow, Math.min(1, (y-55)/20));
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.95, metalness:0}));
  terrain.receiveShadow = true;
  scene.add(terrain);

  const water = new THREE.Mesh(new THREE.PlaneGeometry(size, size),
    new THREE.MeshStandardMaterial({color:0x2c6e8f, roughness:0.08, metalness:0.35, transparent:true, opacity:0.88}));
  water.rotation.x = -Math.PI/2; water.position.y = WATER_Y; water.receiveShadow = true;
  scene.add(water);
}

// ---------- Trees (instanced) ----------
{
  const N = 2600;
  const crownGeo = new THREE.ConeGeometry(1.6, 5, 7); crownGeo.translate(0, 4.2, 0);
  const trunkGeo = new THREE.CylinderGeometry(0.22, 0.3, 2, 6); trunkGeo.translate(0, 1, 0);
  const crowns = new THREE.InstancedMesh(crownGeo, new THREE.MeshStandardMaterial({roughness:0.9}), N);
  const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({color:0x5a3d24, roughness:1}), N);
  crowns.castShadow = trunks.castShadow = true; crowns.receiveShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), col = new THREE.Color();
  let k = 0, tries = 0;
  while (k < N && tries < 40000){
    tries++;
    const x = (Math.random()*2-1)*420, z = (Math.random()*2-1)*420, y = H(x, z);
    if (y < WATER_Y + 1.5 || y > 40) continue;
    // cluster into forests
    if (Math.sin(x*0.03)*Math.cos(z*0.027) + Math.random()*0.6 < 0.15) continue;
    const sc = 0.9 + Math.random()*1.1;
    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.random()*6.28);
    m.compose(p.set(x, y-0.3, z), q, s.set(sc, sc*(0.85+Math.random()*0.5), sc));
    crowns.setMatrixAt(k, m); trunks.setMatrixAt(k, m);
    col.setHSL(0.27 + Math.random()*0.08, 0.45 + Math.random()*0.2, 0.17 + Math.random()*0.1);
    crowns.setColorAt(k, col);
    k++;
  }
  crowns.count = trunks.count = k;
  scene.add(crowns, trunks);
}

// ---------- Clouds ----------
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.4,'rgba(255,255,255,.6)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  const tex = new THREE.CanvasTexture(cv);
  for (let c=0;c<26;c++){
    const cx = (Math.random()*2-1)*600, cz = (Math.random()*2-1)*600, cy = 110 + Math.random()*60;
    for (let i=0;i<7;i++){
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, opacity:0.55, depthWrite:false, color:0xffffff}));
      sp.position.set(cx + (Math.random()-0.5)*80, cy + (Math.random()-0.5)*12, cz + (Math.random()-0.5)*50);
      const sc = 50 + Math.random()*70; sp.scale.set(sc, sc*0.55, 1);
      scene.add(sp);
    }
  }
}

// ---------- Drone ----------
function makeDrone(){
  const g = new THREE.Group();
  const carbon = new THREE.MeshStandardMaterial({color:0x1a1d22, metalness:0.55, roughness:0.38});
  const shell  = new THREE.MeshStandardMaterial({color:0xeef1f5, metalness:0.25, roughness:0.22});
  const accent = new THREE.MeshStandardMaterial({color:0xff5a1f, metalness:0.35, roughness:0.3});
  const metal  = new THREE.MeshStandardMaterial({color:0x9aa3ad, metalness:0.95, roughness:0.25});
  const glass  = new THREE.MeshStandardMaterial({color:0x0a1830, metalness:0.9, roughness:0.05, emissive:0x113366, emissiveIntensity:0.4});
  const add = (mesh, parent=g) => { mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh; };

  // fuselage
  add(new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.3, 1.6), carbon));
  const top = add(new THREE.Mesh(new THREE.SphereGeometry(0.6, 40, 20, 0, Math.PI*2, 0, Math.PI/2), shell));
  top.scale.set(0.82, 0.48, 1.35); top.position.y = 0.14;
  const nose = add(new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 16), shell));
  nose.scale.set(1.45, 0.55, 0.9); nose.position.set(0, 0.04, 0.78);
  const stripe = add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 1.1), accent));
  stripe.position.set(0, 0.42, -0.05);
  const gps = add(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.06, 24), carbon));
  gps.position.set(0, 0.44, -0.45);
  const batt = add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.18, 0.9), new THREE.MeshStandardMaterial({color:0x2c3138, metalness:0.3, roughness:0.5})));
  batt.position.set(0, -0.22, -0.15);

  const props = [], blurs = [], leds = [];
  const armLen = 1.45;
  [[1,1],[-1,1],[-1,-1],[1,-1]].forEach(([sx, sz], i) => {
    const ang = Math.atan2(sz, sx);
    const pivot = new THREE.Group(); pivot.rotation.y = -ang; g.add(pivot);
    const arm = add(new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.1, armLen, 16), carbon), pivot);
    arm.rotation.z = Math.PI/2; arm.position.x = armLen/2;
    const band = add(new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.12, 16), sz > 0 ? accent : shell), pivot);
    band.rotation.z = Math.PI/2; band.position.x = armLen - 0.3;

    const tx = Math.cos(ang)*armLen, tz = Math.sin(ang)*armLen;
    const motor = add(new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.24, 28), carbon));
    motor.position.set(tx, 0.06, tz);
    const bell = add(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.17, 0.08, 28), metal));
    bell.position.set(tx, 0.22, tz);

    const prop = new THREE.Group(); prop.position.set(tx, 0.29, tz); g.add(prop);
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.06, 16), metal), prop);
    for (let b=0;b<2;b++){
      const blade = add(new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.014, 0.085), carbon), prop);
      blade.position.x = (b ? -1 : 1) * 0.31; blade.rotation.x = (b ? -1 : 1) * 0.18;
      const tip = add(new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.016, 0.087), accent), prop);
      tip.position.x = (b ? -1 : 1) * 0.57; tip.rotation.x = blade.rotation.x;
    }
    props.push({obj:prop, dir: (i % 2 ? -1 : 1)});
    const blur = new THREE.Mesh(new THREE.CircleGeometry(0.62, 48),
      new THREE.MeshBasicMaterial({color:0x30343a, transparent:true, opacity:0.16, side:THREE.DoubleSide, depthWrite:false}));
    blur.rotation.x = -Math.PI/2; blur.position.set(tx, 0.295, tz); g.add(blur); blurs.push(blur);

    // navigation LEDs (front white/green, rear red)
    const ledCol = sz > 0 ? (sx > 0 ? 0x33ff88 : 0xffffff) : 0xff2a2a;
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 8), new THREE.MeshBasicMaterial({color:ledCol}));
    led.position.set(tx, -0.1, tz); g.add(led);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({color:ledCol, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false}));
    halo.scale.set(0.45, 0.45, 1); led.add(halo);
    leds.push({led, halo, rear: sz < 0});

    // landing legs under motors
    const leg = add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.025, 0.42, 10), shell));
    leg.position.set(tx, -0.27, tz);
    const foot = add(new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), carbon));
    foot.position.set(tx, -0.49, tz);
  });

  // gimbal camera
  const gimbal = new THREE.Group(); gimbal.position.set(0, -0.28, 0.72); g.add(gimbal);
  const yoke = add(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.06, 0.12), carbon), gimbal);
  yoke.position.y = 0.06;
  const cam = add(new THREE.Mesh(new THREE.SphereGeometry(0.15, 28, 18), carbon), gimbal);
  cam.position.y = -0.08;
  const lensRing = add(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.08, 28), metal), gimbal);
  lensRing.rotation.x = Math.PI/2; lensRing.position.set(0, -0.08, 0.15);
  const lens = add(new THREE.Mesh(new THREE.CircleGeometry(0.075, 28), glass), gimbal);
  lens.position.set(0, -0.08, 0.192);

  return {group:g, props, blurs, leds, gimbal};
}
const drone = makeDrone();
scene.add(drone.group);

// ---------- Flight path ----------
const pts = [];
for (let i=0;i<16;i++){
  const a = i/16*Math.PI*2;
  const r = 150 + 55*Math.sin(a*3) + 25*Math.cos(a*5);
  const x = Math.cos(a)*r, z = Math.sin(a)*r*0.85;
  pts.push(new THREE.Vector3(x, Math.max(H(x,z), WATER_Y) + 13 + 7*Math.sin(a*4), z));
}
const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
const pathLen = curve.getLength();

// ---------- Animation ----------
const clock = new THREE.Clock();
let u = 0, altY = pts[0].y, prevHeading = null, yawRate = 0, vy = 0, prevAlt = altY;
const dronePos = new THREE.Vector3(), fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0,1,0);
const camPos = new THREE.Vector3(), camTarget = new THREE.Vector3(), lookAt = new THREE.Vector3(), tmp = new THREE.Vector3();
const hud = document.getElementById('hud');
const MODE_TIME = 11;
let firstFrame = true, battery = 98.0;

function camGoal(mode, t){
  const p = dronePos.clone();
  switch (mode){
    case 0: return p.addScaledVector(fwd, -7.5).addScaledVector(up, 2.6);                                   // chase
    case 1: return p.addScaledVector(right, 7.5).addScaledVector(up, 0.8).addScaledVector(fwd, 1.5);         // side tracking
    case 2: return p.addScaledVector(fwd, 7).addScaledVector(up, 0.6).addScaledVector(right, -1.5);          // head-on
    case 3: { const a = t*0.35; return p.add(tmp.set(Math.cos(a)*8.5, 2.5 + Math.sin(t*0.5), Math.sin(a)*8.5)); } // orbit
    default: return p.addScaledVector(fwd, -28).addScaledVector(right, 18).addScaledVector(up, 11);          // wide
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  // speed varies gently
  const speed = 15 + 4*Math.sin(t*0.15);
  u = (u + dt*speed/pathLen) % 1;
  const cp = curve.getPointAt(u);
  curve.getTangentAt(u, fwd); fwd.y = 0; fwd.normalize();
  right.crossVectors(fwd, up).normalize();

  // terrain following altitude
  const ahead = Math.max(H(cp.x, cp.z), H(cp.x + fwd.x*12, cp.z + fwd.z*12), H(cp.x + fwd.x*25, cp.z + fwd.z*25), WATER_Y);
  const targetY = Math.max(cp.y, ahead + 10);
  altY += (targetY - altY) * Math.min(1, dt*1.2);
  vy = THREE.MathUtils.lerp(vy, (altY - prevAlt)/Math.max(dt,1e-4), Math.min(1, dt*3)); prevAlt = altY;
  dronePos.set(cp.x, altY + Math.sin(t*1.7)*0.12, cp.z);

  // attitude
  const heading = Math.atan2(fwd.x, fwd.z);
  if (prevHeading !== null){
    let dh = heading - prevHeading; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    yawRate = THREE.MathUtils.lerp(yawRate, dh/Math.max(dt,1e-4), Math.min(1, dt*2.5));
  }
  prevHeading = heading;
  const roll = THREE.MathUtils.clamp(-yawRate*1.1, -0.55, 0.55) + Math.sin(t*2.3)*0.015;
  const pitch = 0.13 + (speed-15)*0.012 - THREE.MathUtils.clamp(vy*0.02, -0.12, 0.12) + Math.sin(t*1.9)*0.01;
  drone.group.position.copy(dronePos);
  drone.group.rotation.set(pitch, heading, roll, 'YXZ');
  drone.gimbal.rotation.set(-pitch + 0.25, 0, -roll); // stabilized gimbal

  // props + LEDs
  drone.props.forEach(p => p.obj.rotation.y += p.dir * dt * 75);
  drone.blurs.forEach((b,i) => b.material.opacity = 0.14 + 0.04*Math.sin(t*40 + i));
  const blink = (t % 1.2) < 0.12;
  drone.leds.forEach(l => { if (l.rear){ l.halo.material.opacity = blink ? 1 : 0.25; l.halo.scale.setScalar(blink ? 0.9 : 0.4); } });

  // cinematic camera
  const mode = Math.floor(t / MODE_TIME) % 5;
  const goal = camGoal(mode, t);
  goal.y = Math.max(goal.y, H(goal.x, goal.z) + 2, WATER_Y + 1.5);
  if (firstFrame){ camPos.copy(goal); lookAt.copy(dronePos); firstFrame = false; }
  camPos.lerp(goal, 1 - Math.exp(-dt*2.2));
  camTarget.copy(dronePos).addScaledVector(fwd, mode === 4 ? 6 : 1.2);
  lookAt.lerp(camTarget, 1 - Math.exp(-dt*6));
  camera.position.copy(camPos);
  camera.lookAt(lookAt);
  sky.position.copy(camera.position);

  // sun & shadows follow drone
  sun.position.copy(dronePos).addScaledVector(sunDir, 150);
  sun.target.position.copy(dronePos);

  // HUD
  battery = Math.max(12, battery - dt*0.04);
  const deg = ((-heading*180/Math.PI) + 360) % 360;
  hud.innerHTML =
    `<span>ALT</span>${(altY - Math.max(H(cp.x,cp.z), WATER_Y)).toFixed(1)} m<br>` +
    `<span>SPD</span>${(speed*3.6).toFixed(0)} km/h<br>` +
    `<span>HDG</span>${deg.toFixed(0).padStart(3,'0')}°<br>` +
    `<span>BAT</span>${battery.toFixed(0)}%`;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
